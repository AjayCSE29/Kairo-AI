services:
  kairo:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /app/data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
    volumes:
      - kairo-data:/app/data
    restart: unless-stopped

volumes:
  kairo-data:
